name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: StyLua check
        run: stylua --check src/ build/

      - name: Selene lint (src/)
        run: selene src/

      - name: Selene lint (build/)
        run: selene build/

      - name: Bundle
        run: lune run build/bundle

      - name: Smoke-run bundle
        run: |
          cp dist/kushanv2 /tmp/kushanv2.lua
          lune run /tmp/kushanv2.lua

      - name: Verify dist/ is up-to-date
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::dist/kushanv2 is stale. Run 'lune run build/bundle' and commit the result."
            exit 1
          fi
